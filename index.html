<style>

html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.ch{display:flex;flex-direction:column;height:100%}
.chh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:3px solid var(--ac);min-height:56px}
.chi{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid transparent;transition:all .15s;white-space:nowrap;min-height:40px;min-width:40px;justify-content:center}
.bp{background:var(--ac);color:#fff;border-color:var(--ac)}

.cia{padding:10px 14px;padding-bottom:calc(10px + var(--sb));background:var(--bg2);border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end}
.cia textarea{flex:1;resize:none;border:2px solid var(--bd);border-radius:var(--r);padding:10px 14px;font-size:16px;font-family:inherit;line-height:1.5;outline:none;min-height:44px;max-height:120px}

.sbtn2{width:44px;height:44px;flex-shrink:0;font-size:20px;border-radius:var(--r);padding:0}
.typ{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--t2);font-size:13px}
.td{display:flex;gap:3px}.td span{width:7px;height:7px;border-radius:50%;background:var(--t2);animation:tp 1.4s infinite}
.td span:nth-child(2){animation-delay:.2s}.td span:nth-child(3){animation-delay:.4s}

.ed{max-width:680px;margin:0 auto;padding:16px;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.edh{display:flex;align-items:center;gap:10px;margin-bottom:20px}.edh h2{font-size:19px;flex:1}

.imd{border:2px dashed var(--bd);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--t2);font-size:13px;display:block}

.wn{font-size:14px;font-weight:600;flex:1}.wd{font-size:12px;color:var(--t2)}
.pck{display:flex;flex-wrap:wrap;gap:8px}
.pi{width:48px;height:48px;font-size:26px;border:2px solid var(--bd);border-radius:var(--rs);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center}

.ci{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.ci:active{transform:scale(1.15)}.ci.sl{border-color:var(--ac);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.avup{position:relative;display:inline-block}
.avpv{width:80px;height:80px;border-radius:var(--r);border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:36px;background:var(--bg)}
.avpv:hover{border-color:var(--ac)}.avpv img{width:100%;height:100%;object-fit:cover}
.avup input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.avcl{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--dg);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.nr{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sb{width:100%;padding:10px 12px;border:none;border-radius:var(--rs);font-size:14px;cursor:pointer;color:#fff;background:var(--ac);font-family:inherit;font-weight:500;text-align:center}
.sb:active{filter:brightness(1.1)}
.bl{overflow-y:auto;padding:4px 8px;-webkit-overflow-scrolling:touch;max-height:30vh}
.bi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);cursor:pointer;font-size:14px}
.bi:active{background:var(--sh)}.bi.act{background:var(--sa)}
.bia{font-size:22px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px;flex-shrink:0}
.bia img{width:100%;height:100%;object-fit:cover}
.bin{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bie{opacity:0;background:none;border:none;color:var(--sm);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.bi:active .bie,.bi:hover .bie{opacity:1}
.ble{text-align:center;padding:20px 12px;color:var(--sm);font-size:12px;line-height:1.8}
.svf{padding:8px 10px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;cursor:pointer}
.svf:active{background:rgba(255,255,255,.05)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:768px){.sv{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.3)}.sv.op{transform:translateX(0)}.svc{display:flex}.sideo.sh{display:block}.hmb{display:flex}.mr{max-width:90%}.chh{padding:8px 12px;min-height:52px}.ms{padding:12px}.cia{padding:8px 10px;padding-bottom:calc(8px + var(--sb))}.ed{padding:12px}.tb{font-size:12px}}
</style></head><body>
<div id="root"></div>
<!-- Step 1: Load libraries -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<!-- Step 2: Application code (JSX) -->
<script type="text/babel" data-presets="env,react">

// ===== 配置 =====
const SURL = 'https://tayaketmnrlzfrsfsqce.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheWFrZXRtbnJsemZyc2ZzcWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODczMTMsImV4cCI6MjEwMDQ2MzMxM30.tFVRpbS4-FmJ4jaJ8AWXMVCjxBJlBZJNj0ukXraklXU';
const sup = window.supabase.createClient(SURL, SKEY);
const { useState, useEffect, useRef } = React;

// 常量
const AV = ['🤖','🧑‍🚀','🦊','🐱','🐶','🐼','🦄','🐉','🧙‍♂️','🧛','🧝','👻','😺','🦸','👽'];
const CL = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];

// 工具
const isM = () => window.innerWidth <= 768;
const UN = d => d || '用户';
const ER = (e, f) => {
  if (!e) return f || '未知错误';
  if (typeof e === 'string' && e.length > 0 && e !== '{}') return e;
  if (e.message && typeof e.message === 'string' && e.message.length > 1 && e.message !== '{}') return e.message;
  return f || '请求失败';
};
const UID = async () => { const r = await sup.auth.getUser(); return r.data.user ? r.data.user.id : null; };
const COMP = (file, w, h) => new Promise((rs, rj) => {
  const rr = new FileReader();
  rr.onload = e => { const img = new Image(); img.onload = () => {
    let iw = img.width, ih = img.height;
    if (iw > w || ih > h) { const rt = Math.min(w/iw, h/ih); iw = Math.round(iw*rt); ih = Math.round(ih*rt); }
    const c = document.createElement('canvas'); c.width = iw; c.height = ih;
    c.getContext('2d').drawImage(img, 0, 0, iw, ih); rs(c.toDataURL('image/jpeg', 0.7));
  }; img.src = e.target.result; }; rr.onerror = rj; rr.readAsDataURL(file);
});

// 系统提示
const SP = (bot, wv, st) => {
  let p = '你是"' + bot.name + '"\n';
  if (bot.personality) p += '【性格】' + bot.personality + '\n';
  if (bot.backstory) p += '【背景故事】' + bot.backstory + '\n';
  if (wv) {
    p += '【世界观】时代:' + (wv.era||'未设定') + ';科技:' + (wv.technology||'未设定') + ';大事件:' + (wv.world_events||'无') + '\n';
    p += '【时代约束】不能出现不符合该时代的物品、概念或事件\n';
  }
  const nm = UN(st.display_name);
  const g = st.gender === 'male' ? '男性' : st.gender === 'female' ? '女性' : '';
  p += '【对话对象】' + (g ? '名叫' + nm + '的' + g + '用户' : '名叫' + nm + '的用户') + '\n';
  p += '【规则】\n1.()内为动作或心理，()外为对话\n2.用第三人称，自称“' + bot.name + '”\n3.用户可用金手指改变剧情\n';
  if (wv) p += '4.严格遵守世界观\n';
  return p;
};

// ===== 组件 =====

const Avatar = p => p.url ? <div style={{width:p.s||32,height:p.s||32,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'50%',flexShrink:0}}><img src={p.url} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/></div> : <div style={{width:p.s||32,height:p.s||32,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'50%',flexShrink:0,background:'var(--bg)'}}>{p.e||'🤖'}</div>;

const AvUp = p => {
  const hf = async e => { const f = e.target.files[0]; if (!f) return; try { p.onChange(await COMP(f, 200, 200)); } catch(_) {} };
  const hi = p.value && p.value.indexOf('data:') === 0;
  return <div className="avup">
    <label className="avpv">{hi ? <img src={p.value} alt=""/> : (p.ce || '📷')}</label>
    <input type="file" accept="image/*" onChange={hf}/>
    {hi && <button type="button" className="avcl" onClick={e => { e.preventDefault(); p.onChange(''); }}>✕</button>}
  </div>;
};

const MsgB = p => {
  const uu = p.msg.role === 'user';
  return <div className={"mr" + (uu ? " u" : "")}>
    {!uu ? <div className="mav" style={{background: p.color + '20'}}>{typeof p.ba === 'string' && p.ba.indexOf('data:') === 0 ? <img src={p.ba} alt=""/> : p.ba}</div> : <div className="mav ua">{p.ua ? <img src={p.ua} alt=""/> : '👤'}</div>}
    <div className={"mb " + (uu ? "ub" : "ab")} style={uu ? null : {borderLeft: '3px solid ' + p.color}}>{p.msg.content}</div>
    {!uu && <div style={{width:32,flexShrink:0}}/>}
  </div>;
};

const Types = p => <div className="typ">
  <div className="mav" style={{background: p.color + '20'}}>{typeof p.av === 'string' && p.av.indexOf('data:') === 0 ? <img src={p.av} alt=""/> : p.av}</div>
  <div className="td"><span/><span/><span/></div><span>{p.name} 正在输入...</span>
</div>;

// ===== 登录/注册 =====
const AuthPage = () => {
  const [mode,setMode]=useState('login'),[email,setEmail]=useState(''),[pw,setPw]=useState(''),[ld,setLd]=useState(false),[err,setErr]=useState('');
  const sub = async e => { e.preventDefault();
    if (!email.trim() || !pw) { setErr('请填写邮箱和密码'); return; }
    setLd(true); setErr('');
    try {
      const fn = mode === 'login' ? 'signInWithPassword' : 'signUp';
      const args = mode === 'login' ? {email,pw} : {email,pw,options:{emailRedirectTo:window.location.origin}};
      const r = await sup.auth[fn](args);
      if (r.error) { setErr(ER(r.error, mode === 'login' ? '登录失败' : '注册失败')); setLd(false); return; }
      if (mode === 'register') { setErr(r.data?.session ? '✅ 注册成功！' : '✅ 成功！请登录'); if (!r.data?.session) setMode('login'); setPw(''); }
      setLd(false);
    } catch (e) { setErr(ER(e)); setLd(false); }
  };
  return <div className="m0"><div className="card">
    <div className="tt1">AI角色扮演</div><div className="tt2">创造属于你的故事</div>
    {err && <div className="er">{err}</div>}
    <form onSubmit={sub}><div className="f1"><label>邮箱</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" autoFocus/></div>
      <div className="f1"><label>密码</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={mode==='login'?'输入密码':'设置密码(至少6位)'}/></div>
      <button type="submit" className="sbtn" disabled={ld}>{ld?'处理中...':mode==='login'?'登录':'注册'}</button>
    </form>
    <div className="sw">{mode==='login'?'没有账号？':'已有账号？'}<a onClick={()=>{setMode(mode==='login'?'register':'login');setErr('')}}>{mode==='login'?'注册':'登录'}</a></div>
  </div></div>;
};

// ===== 首页 =====
const Empty = p => <div className="em">
  {isM() && <button className="hmb" style={{display:'flex',marginBottom:12}} onClick={p.mc}>☰</button>}
  <div className="emi">👋</div><h2>欢迎回来！</h2><p>创造属于你的故事。</p>
</div>;

// ===== 聊天 =====
const ChatWin = p => {
  const [ms,setMs]=useState([]),[inp,setInp]=useState(''),[ld,setLd]=useState(false),[er,setEr]=useState('');
  const erR=useRef(null),ir=useRef(null);
  const lm=async()=>{try{const r=await sup.from('messages').select('*').eq('bot_id',p.bot.id).order('created_at',{ascending:true});setMs(r.data||[]);}catch(_){setMs([]);}};
  useEffect(()=>{lm();setEr('');setInp('');setTimeout(()=>ir.current?.focus(),100);},[p.bot.id]);
  useEffect(()=>{erR.current?.scrollIntoView({behavior:'smooth'});},[ms,ld]);

  const snd = async () => {
    const c = inp.trim(); if (!c || ld) return;
    setInp(''); setLd(true); setEr('');
    const opt = {id:'t'+Date.now(),bot_id:p.bot.id,role:'user',content:c,created_at:new Date().toISOString()};
    setMs(m=>[...m,opt]);
    try {
      const id = await UID();
      const _s = await sup.from('user_settings').select('*').single();
      const s = _s.data; if (_s.error || !s?.api_key) { setEr('请先设置 API Key'); setMs(m=>m.filter(x=>x.id!==opt.id)); setLd(false); return; }
      const wv = p.bot.worldview_id ? (p.wvs||[]).find(w=>w.id===p.bot.worldview_id) : null;
      const sys = SP(p.bot, wv, s);
      await sup.from('messages').insert({user_id:id,bot_id:p.bot.id,role:'user',content:c});

      {view==='sa' && <Settings onBack={()=>setV('chat')} onUpd={rf} up={up} it="account"/>}
      {view==='chat' && ab && <ChatWin bot={ab} onUpd={la} mc={()=>setSo(v=>!v)} up={up} wvs={wvs}/>}
      {view==='chat' && !ab && <Empty mc={()=>setSo(v=>!v)}/>}
    </main>
  </div>;
};

// ===== 根组件 =====
const App = () => {
  const [ss,setSS]=useState(null),[ld,setLd]=useState(true);
  useEffect(()=>{sup.auth.getSession().then(r=>{setSS(r.data.session);setLd(false);});const sub=sup.auth.onAuthStateChange((_,s)=>setSS(s));return()=>sub.data.subscription.unsubscribe();},[]);
  if (ld) return <div className="m0"><div style={{color:'var(--t2)'}}>加载中...</div></div>;
  if (!ss) return <AuthPage/>;
  return <MainApp/>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
