<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI角色扮演</title>
<style>
:root{--bg:#f8fafc;--bg2:#fff;--sidebar:#1e293b;--side-hover:#334155;--side-active:#3b82f6;--txt:#1e293b;--txt2:#64748b;--side-txt:#e2e8f0;--side-muted:#94a3b8;--border:#e2e8f0;--accent:#6366f1;--danger:#ef4444;--radius:12px;--radius-sm:8px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;touch-action:manipulation}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100%;min-height:100dvh;padding:20px}
.auth-card{background:var(--bg2);border-radius:var(--radius);padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.1);border:1px solid var(--border)}
.auth-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.auth-sub{text-align:center;font-size:13px;color:var(--txt2);margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.auth-field input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
.auth-field input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);font-family:inherit;margin-top:4px;transition:all .15s}
.auth-btn:active{filter:brightness(1.1)}.auth-btn:disabled{opacity:.5}
.auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--txt2)}
.auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.auth-error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px;text-align:center;word-break:break-word}
.logout-btn{background:none;border:1px solid var(--side-muted);color:var(--side-muted);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:var(--radius-sm);font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:3px}
.logout-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.logout-btn:active{background:var(--danger);border-color:var(--danger);color:#fff}
.logout-user{font-size:11px;color:var(--side-muted);padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{display:flex;height:100%;height:100dvh;position:relative}
.sidebar{width:280px;min-width:280px;background:var(--sidebar);color:var(--side-txt);display:flex;flex-direction:column;z-index:100;transition:transform .25s ease}
.sidebar-header{padding:16px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.sidebar-logo{font-size:16px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .15s}.sidebar-logo:hover{opacity:.8}
.sidebar-close{display:none;background:none;border:none;color:var(--side-muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.sidebar-btn{width:100%;padding:10px 12px;border:none;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;color:#fff;background:var(--accent);font-family:inherit;font-weight:500;transition:all .15s;text-align:center}
.sidebar-btn:active{filter:brightness(1.1)}
.nav-row{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.bot-list{overflow-y:auto;padding:4px 8px;-webkit-overflow-scrolling:touch}
.bot-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-size:14px}
.bot-item:active{background:var(--side-hover)}.bot-item.active{background:var(--side-active)}
.bot-item-avatar{font-size:22px;flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px}
.bot-item-avatar img{width:100%;height:100%;object-fit:cover}
.bot-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bot-item-edit{opacity:0;background:none;border:none;color:var(--side-muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.bot-item:active .bot-item-edit,.bot-item:hover .bot-item-edit{opacity:1}
.bot-list-empty{text-align:center;padding:20px 12px;color:var(--side-muted);font-size:12px;line-height:1.8}
.sidebar-footer{padding:8px 10px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:6px;border-radius:8px;color:var(--txt);min-width:40px;min-height:40px;align-items:center;justify-content:center}
.hamburger:active{background:var(--border)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--txt2);padding:20px}
.empty-icon{font-size:56px}.empty h2{font-size:20px;color:var(--txt)}.empty p{font-size:14px;max-width:300px;text-align:center}
.chat{display:flex;flex-direction:column;height:100%}
.chat-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:3px solid var(--accent);min-height:56px}
.chat-header-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.chat-header-avatar{font-size:26px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:var(--radius-sm);flex-shrink:0;overflow:hidden}
.chat-header-avatar img{width:100%;height:100%;object-fit:cover}
.chat-header-text{min-width:0}.chat-header-name{font-size:15px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid transparent;transition:all .15s;white-space:nowrap;min-height:40px;min-width:40px;justify-content:center}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:active{filter:brightness(1.1)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:active{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--txt2)}.btn-ghost:active{background:var(--bg);color:var(--txt)}
.btn-sm{padding:6px 10px;font-size:13px;min-height:36px}.btn:disabled{opacity:.5;pointer-events:none}
.msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px}
.msgs-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt2);gap:6px}
.msgs-empty h3{color:var(--txt);font-size:17px}
.msg-row{display:flex;align-items:flex-start;gap:8px;max-width:85%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{margin-left:auto;flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-avatar.user-avatar{background:var(--sidebar)}
.msg-bubble{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg-bubble.user-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg-bubble.assistant-bubble{background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-input-area{padding:10px 14px;padding-bottom:calc(10px + var(--safe-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.chat-input-area textarea{flex:1;resize:none;border:2px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:16px;font-family:inherit;line-height:1.5;outline:none;min-height:44px;max-height:120px}
.chat-input-area textarea:focus{border-color:var(--accent)}
.send-btn{width:44px;height:44px;flex-shrink:0;font-size:20px;border-radius:var(--radius);padding:0}
.typing{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--txt2);font-size:13px}
.typing-dots{display:flex;gap:3px}.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--txt2);animation:typing 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:scale(.7)}30%{opacity:1;transform:scale(1)}}
.editor{max-width:680px;margin:0 auto;padding:16px;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.editor-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}.editor-header h2{font-size:19px;flex:1}
.section-title{font-size:13px;font-weight:700;color:var(--txt);margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.form-group input[type="text"],.form-group input[type="password"],.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;outline:none;background:var(--bg2)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-hint{font-size:12px;color:var(--txt2);margin-top:4px}.form-hint a{color:var(--accent);text-decoration:none}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker-item{width:48px;height:48px;font-size:26px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px}
.picker-item:active{transform:scale(1.1)}.picker-item.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.color-item{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;min-width:40px;min-height:40px}
.color-item:active{transform:scale(1.15)}.color-item.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.avatar-upload{position:relative;display:inline-block}
.avatar-preview{width:80px;height:80px;border-radius:var(--radius);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:border-color .2s;font-size:36px;background:var(--bg)}
.avatar-preview:hover{border-color:var(--accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-upload input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.avatar-clear{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab-btn{flex:1;min-width:60px;padding:10px 6px;border:none;background:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--txt2);font-family:inherit;transition:all .15s;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.sync-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.sync-section h3{font-size:15px;margin-bottom:4px}.sync-section p{font-size:12px;color:var(--txt2);margin-bottom:12px}
.import-dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--txt2);font-size:13px}
.import-dropzone:active,.import-dropzone:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
.wv-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.wv-card:hover{border-color:var(--accent)}.wv-card:active{border-color:var(--accent)}
.wv-card-name{font-size:14px;font-weight:600;flex:1}.wv-card-desc{font-size:12px;color:var(--txt2)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.3)}.sidebar.open{transform:translateX(0)}.sidebar-close{display:flex}.sidebar-overlay.show{display:block}.hamburger{display:flex}.msg-row{max-width:90%}.chat-header{padding:8px 12px;min-height:52px}.msgs{padding:12px}.chat-input-area{padding:8px 10px;padding-bottom:calc(8px + var(--safe-bottom))}.editor{padding:12px}.tab-btn{font-size:12px}}
</style>
</head>

<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="supabase.min.js"></script>
<script>
const SUPABASE_URL='https://tayaketmnrlzfrsfsqce.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheWFrZXRtbnJsemZyc2ZzcWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODczMTMsImV4cCI6MjEwMDQ2MzMxM30.tFVRpbS4-FmJ4jaJ8AWXMVCjxBJlBZJNj0ukXraklXU';
const AVATARS=['🤖','🧑‍🚀','🦊','🐱','🐶','🐼','🦄','🐉','🧙‍♂️','🧛','🧝','👻','😺','🦸','👽'];
const COLORS=['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];
const {useState,useEffect,useRef}=React;

function isMobile(){return window.innerWidth<=768}
function errMsg(e,f){if(!e)return f||'未知错误';if(typeof e==='string'&&e.length>0&&e!=='{}')return e;if(e.message&&typeof e.message==='string'&&e.message.length>1&&e.message!=='{}')return e.message.replace(/^AuthApiError:\s*/,'');if(e.status)return'服务器错误 (HTTP '+e.status+')';if(e.code)return'错误码: '+e.code;try{const s=JSON.stringify(e);if(s&&s!=='{}')return s}catch(_){}return f||'请求失败'}
async function getUserId(){const{data:{user}}=await supabase.auth.getUser();return user?.id}
function compressImage(file,maxW,maxH){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.7))};img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function userName(dn){return dn||'用户'}
function buildSystemPrompt(bot,worldview,settings){
  let p='你是"'+bot.name+'"。\n';
  if(bot.personality) p+='【性格设定】'+bot.personality+'\n';
  if(bot.backstory) p+='【背景故事】'+bot.backstory+'\n';
  if(worldview){
    p+='【世界观】时代背景: '+(worldview.era||'未设定')+'；科技水平: '+(worldview.technology||'未设定')+'；世界大事件: '+(worldview.world_events||'无')+'\n';
    p+='【时代约束】严格遵守世界观设定，不能出现不符合该时代的物品、概念、科技或事件。\n';
  }
  const uname=userName(settings.display_name);
  const g=settings.gender==='male'?'男性':settings.gender==='female'?'女性':'';
  p+='【对话对象】'+(g?'名叫'+uname+'的'+g+'用户':'名叫'+uname+'的用户')+'。\n';
  p+='【对话规则】\n';
  p+='1. 用圆括号（）表示动作描写或心理活动，括号外的内容为对话。\n';
  p+='2. 动作和心理活动使用第三人称视角，称呼自己为"'+bot.name+'"。\n';
  p+='3. ()内的描述只用于动作与心理活动，不用于对话。\n';
  p+='4. 用户可以使用金手指改变剧情走向。当用户明确使用金手指时，完全按用户意愿推进剧情。\n';
  if(worldview) p+='5. 严格遵守世界观设定中的所有约束。\n';
  return p;
}

function e(type,props,key,...children){const f=children.flatMap((c,i)=>{if(c==null||c===false)return[];if(typeof c==='string'||typeof c==='number')return[e('span',{key:'t'+(key||'')+i},String(c))];return[c]});return React.createElement(type,props||{},...f)}

function Avatar(p){if(p.url){return e('div',{style:{width:p.size||32,height:p.size||32,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'50%',flexShrink:0,...(p.style||{})}},e('img',{src:p.url,style:{width:'100%',height:'100%',objectFit:'cover'},alt:''}));}return e('div',{style:{width:p.size||32,height:p.size||32,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'50%',flexShrink:0,background:'var(--bg)',...(p.style||{})}},p.emoji||'🤖');}

function AuthPage(){
  const[mode,setMode]=useState('login');const[email,setEmail]=useState('');const[password,setPassword]=useState('');const[loading,setLoading]=useState(false);const[err,setErr]=useState('');
  const handleSubmit=async()=>{
    if(!email.trim()||!password){setErr('请填写邮箱和密码');return;}
    setLoading(true);setErr('');
    try{
      if(mode==='login'){
        const{error}=await supabase.auth.signInWithPassword({email,password});
        if(error){setErr(errMsg(error,'登录失败'));setLoading(false);return;}
      } else {
        if(password.length<6){setErr('密码至少6位');setLoading(false);return;}
        const{data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});
        if(error){setErr(errMsg(error,'注册失败'));setLoading(false);return;}
        if(data?.session){setErr('✅ 注册成功！自动登录中...');} else {
          setErr('✅ 注册成功！请切换到登录页登录');setMode('login');
        }
        setPassword('');
      }
    }catch(e){setErr(errMsg(e,'网络错误'));}
    setLoading(false);
  };
  return e('div',{className:'auth-page'},
    e('div',{className:'auth-card'},
      e('div',{className:'auth-title'},'AI角色扮演'),
      e('div',{className:'auth-sub'},'创造属于你的故事'),
      err&&e('div',{className:'auth-error'},err),
      e('form',{onSubmit:ev=>{ev.preventDefault();handleSubmit();}},
        e('div',{className:'auth-field'},
          e('label',null,'邮箱'),
          e('input',{type:'email',value:email,onChange:ev=>setEmail(ev.target.value),placeholder:'your@email.com',autoFocus:true})
        ),
        e('div',{className:'auth-field'},
          e('label',null,'密码'),
          e('input',{type:'password',value:password,onChange:ev=>setPassword(ev.target.value),placeholder:mode==='login'?'输入密码':'设置密码（至少6位）'})
        ),
        e('button',{className:'auth-btn',type:'submit',disabled:loading},loading?'处理中...':mode==='login'?'登录':'注册')
      ),
      e('div',{className:'auth-toggle'},mode==='login'?`没有账号？`:'已有账号？',
        e('a',{onClick:()=>{setMode(mode==='login'?'register':'login');setErr('')}},mode==='login'?'注册':'登录')
      )
    )
  );
}

function AvatarUpload(p){
  const handleFile=async ev=>{const f=ev.target.files?.[0];if(!f)return;try{const b64=await compressImage(f,200,200);p.onChange(b64);}catch(err){}};
  const hasImg=p.value&&p.value.startsWith('data:');
  return e('div',{className:'avatar-upload'},
    e('label',{className:'avatar-preview'},hasImg?e('img',{src:p.value,alt:''}):p.currentEmoji||'📷'),
    e('input',{type:'file',accept:'image/*',onChange:handleFile}),
    hasImg&&e('button',{className:'avatar-clear',onClick:ev=>{ev.preventDefault();p.onChange('')},type:'button'},'✕')
  );
}

function ChatWindow(p){
  const[msgs,setMsgs]=useState([]);const[input,setInput]=useState('');const[loading,setLoading]=useState(false);const[err,setErr]=useState('');
  const endRef=useRef(null);const inputRef=useRef(null);
  const loadMessages=async()=>{try{const{data}=await supabase.from('messages').select('*').eq('bot_id',p.bot.id).order('created_at',{ascending:true});setMsgs(data||[]);}catch(err){console.error(err);setMsgs([]);}};
  useEffect(()=>{loadMessages();setErr('');setInput('');setTimeout(()=>inputRef.current?.focus(),100);},[p.bot.id]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,loading]);

  const handleSend=async()=>{
    const content=input.trim();if(!content||loading)return;
    setInput('');setLoading(true);setErr('');
    const optimistic={id:'temp_'+Date.now(),bot_id:p.bot.id,role:'user',content,created_at:new Date().toISOString()};
    setMsgs(m=>[...m,optimistic]);
    try{
      const uid=await getUserId();
      const{data:s,error:sErr}=await supabase.from('user_settings').select('*').single();
      if(sErr||!s?.api_key){setErr('请先在设置中配置 API Key');setMsgs(m=>m.filter(x=>x.id!==optimistic.id));setLoading(false);return;}
      const wv=p.bot.worldview_id?(p.worldviews||[]).find(w=>w.id===p.bot.worldview_id):null;
      const sysPrompt=buildSystemPrompt(p.bot,wv,s);
      const{error:insErr}=await supabase.from('messages').insert({user_id:uid,bot_id:p.bot.id,role:'user',content});
      if(insErr){setErr('保存失败');setMsgs(m=>m.filter(x=>x.id!==optimistic.id));setLoading(false);return;}
      const history=(await supabase.from('messages').select('role,content').eq('bot_id',p.bot.id).order('created_at',{ascending:true}).limit(20)).data||[];
      const messages=[{role:'system',content:sysPrompt},...history.map(m=>({role:m.role,content:m.content}))];
      const res=await fetch((s.api_base_url||'https://api.deepseek.com')+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.api_key},body:JSON.stringify({model:p.bot.model||'deepseek-chat',messages,temperature:.8,max_tokens:2000})});
      if(!res.ok){const e2=await res.json().catch(()=>({}));throw new Error(e2.error?.message||'HTTP '+res.status);}
      const d=await res.json();const reply=d.choices?.[0]?.message?.content||'...';
      await supabase.from('messages').insert({user_id:uid,bot_id:p.bot.id,role:'assistant',content:reply});
      await supabase.from('bots').update({updated_at:new Date().toISOString()}).eq('id',p.bot.id);
      await loadMessages();p.onUpdate();
    }catch(err){setErr('发送失败：'+errMsg(err));setMsgs(m=>m.filter(x=>x.id!==optimistic.id));}
    finally{setLoading(false);inputRef.current?.focus();}
  };

  const handleClear=async()=>{if(!window.confirm('确定清空聊天记录？'))return;try{await supabase.from('messages').delete().eq('bot_id',p.bot.id);setMsgs([]);}catch(err){setErr('清空失败：'+errMsg(err));}};

  return e('div',{className:'chat'},
    e('div',{className:'chat-header',style:{borderBottomColor:p.bot.theme_color}},
      e('button',{className:'hamburger',onClick:p.onMenuClick},'☰'),
      e('div',{className:'chat-header-info'},
        e('div',{className:'chat-header-avatar'},p.bot.avatar_url?e('img',{src:p.bot.avatar_url,alt:''}):p.bot.avatar),
        e('div',{className:'chat-header-text'},e('div',{className:'chat-header-name'},p.bot.name))
      ),
      e('button',{className:'btn btn-ghost btn-sm',onClick:handleClear},'🗑')
    ),
    e('div',{className:'msgs'},
      msgs.length===0&&e('div',{className:'msgs-empty'},
        e('div',{style:{fontSize:40}},p.bot.avatar_url?e('img',{src:p.bot.avatar_url,style:{width:40,height:40,borderRadius:8,objectFit:'cover'},alt:''}):p.bot.avatar),
        e('h3',null,'开始和'+p.bot.name+'聊天吧！')
      ),
      msgs.map(m=>e(MessageBubble,{key:m.id,msg:m,botAvatar:p.bot.avatar_url||p.bot.avatar,userAvatar:p.userProfile?.avatar_url,color:p.bot.theme_color})),
      loading&&e(Typing,{avatar:p.bot.avatar_url||p.bot.avatar,name:p.bot.name,color:p.bot.theme_color}),
      err&&e('div',{className:'error'},err),
      e('div',{ref:endRef})
    ),
    e('div',{className:'chat-input-area'},
      e('textarea',{ref:inputRef,value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();handleSend();}},placeholder:'跟'+p.bot.name+'说点什么...',rows:1,disabled:loading,autoFocus:true}),
      e('button',{className:'btn btn-primary send-btn',onClick:handleSend,disabled:!input.trim()||loading},'➤')
    )
  );
}

        e('input',{type:'text',value:s.default_model||'',onChange:ev=>setS({...s,default_model:ev.target.value}),placeholder:'deepseek-chat'})
      ),
      e('button',{className:'btn btn-primary',style:{marginTop:'16px'},onClick:saveApi},'💾 保存')
    ):tab==='account'?e('div',null,
      e('div',{className:'form-group'},
        e('label',null,'用户名称'),
        e('input',{type:'text',value:profile.display_name,onChange:ev=>setProfile({...profile,display_name:ev.target.value}),placeholder:'角色会这样称呼你',maxLength:20}),
        e('div',{className:'form-hint'},'对话时的称呼')
      ),
      e('div',{className:'form-group'},
        e('label',null,'头像'),
        e(AvatarUpload,{value:profile.avatar_url,onChange:v=>setProfile({...profile,avatar_url:v}),currentEmoji:'👤'})
      ),
      e('div',{className:'form-group'},
        e('label',null,'性别'),
        e('select',{value:profile.gender,onChange:ev=>setProfile({...profile,gender:ev.target.value})},
          e('option',{value:''},'不设置'),
          e('option',{value:'male'},'男'),
          e('option',{value:'female'},'女'),
          e('option',{value:'other'},'其他')
        )
      ),
      e('button',{className:'btn btn-primary',style:{marginTop:'16px'},onClick:saveProfile},'💾 保存')
    ):e('div',null,
      e('div',{className:'sync-section'},
        e('h3',null,'📤 导出备份'),
        e('p',null,'下载所有角色、消息和设置'),
        e('button',{className:'btn btn-primary',onClick:handleExport},'📥 下载备份'),
        exportMsg&&e('div',{className:'error',style:{background:exportMsg.includes('✅')?'#f0fdf4':'#fef2f2',color:exportMsg.includes('✅')?'#16a34a':'#dc2626',marginTop:8,marginBottom:0}},exportMsg)
      ),
      e('div',{className:'sync-section'},
        e('h3',null,'📥 导入恢复'),
        e('label',{className:'import-dropzone',style:{display:'block'}},
          e('input',{type:'file',accept:'.json',onChange:handleFileImport,style:{display:'none'}}),
          '📁 选择备份文件'
        ),
        importMsg&&e('div',{className:'error',style:{background:importMsg.includes('✅')?'#f0fdf4':'#fef2f2',color:importMsg.includes('✅')?'#16a34a':'#dc2626',marginTop:8,marginBottom:0}},importMsg)
      )
    )
  );
}

function MainApp(){
  const[bots,setBots]=useState([]);const[worldviews,setWorldviews]=useState([]);
  const[activeId,setActiveId]=useState(null);const[view,setView]=useState('chat');
  const[editBot,setEditBot]=useState(null);const[editWv,setEditWv]=useState(null);
  const[sidebarOpen,setSidebarOpen]=useState(!isMobile());const[email,setEmail]=useState('');
  const[userProfile,setUserProfile]=useState(null);const[listOpen,setListOpen]=useState(false);

  useEffect(()=>{(async()=>{try{const{data}=await supabase.auth.getUser();setEmail(data.user?.email||'');await ensureSettings();await loadUserProfile();await loadAll();}catch(err){console.error('init:',err);}const h=()=>{setSidebarOpen(!isMobile());};window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);})();},[]);

  const ensureSettings=async()=>{try{const uid=await getUserId();if(!uid)return;const{data,error}=await supabase.from('user_settings').select('user_id').eq('user_id',uid).maybeSingle();if(error&&error.code==='PGRST116'){await supabase.from('user_settings').insert({user_id:uid,api_base_url:'https://api.deepseek.com',default_model:'deepseek-chat'});}}catch(err){console.error(err);}};
  const loadUserProfile=async()=>{try{const uid=await getUserId();if(!uid)return;const{data}=await supabase.from('user_settings').select('display_name,avatar_url,gender').eq('user_id',uid).maybeSingle();if(data)setUserProfile(data);}catch(err){console.error(err);}};
  const loadAll=async()=>{try{const{data:b}=await supabase.from('bots').select('*').order('updated_at',{ascending:false});const{data:w}=await supabase.from('worldviews').select('*').order('updated_at',{ascending:false});setBots(b||[]);setWorldviews(w||[]);}catch(err){console.error(err);}};

  const handleHome=()=>{setActiveId(null);setView('chat');};
  const handleLogout=async()=>{try{await supabase.auth.signOut();}catch(err){console.error(err);}};
  const handleProfileClick=()=>{setView('settings_account');};
  const refresh=async()=>{await loadAll();await loadUserProfile();};
  const activeBot=bots.find(b=>b.id===activeId)||null;

  return e('div',{className:'app'},
    e(Sidebar,{bots,activeId,onSelect:id=>{setActiveId(id);setView('chat')},onHome:handleHome,onCreate:()=>{setEditBot(null);setView('create')},onEdit:b=>{setEditBot(b);setView('edit')},onSettings:()=>setView('settings'),onProfileClick:handleProfileClick,open:sidebarOpen,onClose:()=>setSidebarOpen(false),onLogout:handleLogout,email,userProfile,onCreateWorldview:()=>{setEditWv(null);setView('create_wv')},onListWorldviews:()=>setView('list_wv'),listOpen,setListOpen}),
    e('main',{className:'main'},
      view==='create'&&e(BotEditor,{onDone:()=>{loadAll();setView('chat')},onCancel:()=>setView('chat'),worldviews}),
      view==='edit'&&editBot&&e(BotEditor,{bot:editBot,onDone:()=>{loadAll();setView('chat');setEditBot(null)},onCancel:()=>setView('chat'),worldviews}),
      view==='create_wv'&&e(WorldviewEditor,{onDone:()=>{loadAll();setView('chat');setEditWv(null)},onCancel:()=>setView('chat')}),
      view==='edit_wv'&&editWv&&e(WorldviewEditor,{wv:editWv,onDone:()=>{loadAll();setView('list_wv');setEditWv(null)},onCancel:()=>setView('list_wv')}),
      view==='list_wv'&&e(WorldviewList,{onBack:()=>setView('chat'),worldviews,onEdit:w=>{setEditWv(w);setView('edit_wv')},onRefresh:loadAll}),
      view==='settings'&&e(SettingsView,{onBack:()=>setView('chat'),onRefresh:refresh,userProfile}),
      view==='settings_account'&&e(SettingsView,{onBack:()=>setView('chat'),onRefresh:refresh,userProfile,initialTab:'account'}),
      view==='chat'&&activeBot&&e(ChatWindow,{bot:activeBot,onUpdate:loadAll,onMenuClick:()=>setSidebarOpen(v=>!v),userProfile,worldviews}),
      view==='chat'&&!activeBot&&e(EmptyState,{onMenuClick:()=>setSidebarOpen(v=>!v)})
    )
  );
}

function EmptyState(p){
  return e('div',{className:'empty'},
    isMobile()&&e('button',{className:'hamburger',style:{display:'flex',marginBottom:12},onClick:p.onMenuClick},'☰'),
    e('div',{className:'empty-icon'},'👋'),
    e('h2',null,'欢迎回来！'),
    e('p',null,'创造属于你的故事。')
  );
}

function App(){
  const[session,setSession]=useState(null);const[loading,setLoading]=useState(true);
  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{setSession(session);setLoading(false);});
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_e,session)=>setSession(session));
    return()=>subscription.unsubscribe();
  },[]);
  if(loading)return e('div',{className:'auth-page'},e('div',{style:{color:'var(--txt2)'}},'加载中...'));
  if(!session)return e(AuthPage);
  return e(MainApp);
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
