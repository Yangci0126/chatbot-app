<head>

<style>
:root{--bg:#f8fafc;--bg2:#fff;--sidebar:#1e293b;--side-hover:#334155;--side-active:#3b82f6;--txt:#1e293b;--txt2:#64748b;--side-txt:#e2e8f0;--side-muted:#94a3b8;--border:#e2e8f0;--accent:#6366f1;--danger:#ef4444;--radius:12px;--radius-sm:8px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;touch-action:manipulation}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100%;min-height:100dvh;padding:20px}
.auth-card{background:var(--bg2);border-radius:var(--radius);padding:32px 24px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.1);border:1px solid var(--border)}
.auth-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.auth-sub{text-align:center;font-size:13px;color:var(--txt2);margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.auth-field input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
.auth-field input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);font-family:inherit;margin-top:4px;transition:all .15s}
.auth-btn:active{filter:brightness(1.1)}.auth-btn:disabled{opacity:.5}
.auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--txt2)}
.auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.auth-error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px;text-align:center;word-break:break-word}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--txt2);padding:20px}

.chat-header-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid transparent;transition:all .15s;white-space:nowrap;min-height:40px;min-width:40px;justify-content:center}

.msg-avatar.user-avatar{background:var(--sidebar)}

.typing{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--txt2);font-size:13px}

.section-title{font-size:13px;font-weight:700;color:var(--txt);margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.form-group input[type="text"],.form-group input[type="password"],.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;outline:none;background:var(--bg2)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-hint{font-size:12px;color:var(--txt2);margin-top:4px}.form-hint a{color:var(--accent);text-decoration:none}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker-item{width:48px;height:48px;font-size:26px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px}
.picker-item:active{transform:scale(1.1)}.picker-item.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.color-item{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;min-width:40px;min-height:40px}
.color-item:active{transform:scale(1.15)}.color-item.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.avatar-upload{position:relative;display:inline-block}
.avatar-preview{width:80px;height:80px;border-radius:var(--radius);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:border-color .2s;font-size:36px;background:var(--bg)}
.avatar-preview:hover{border-color:var(--accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-upload input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.avatar-clear{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab-btn{flex:1;min-width:60px;padding:10px 6px;border:none;background:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--txt2);font-family:inherit;transition:all .15s;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.sync-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.sync-section h3{font-size:15px;margin-bottom:4px}.sync-section p{font-size:12px;color:var(--txt2);margin-bottom:12px}
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{flex:1;min-width:100px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-card .stat-num{font-size:24px;font-weight:700;color:var(--accent)}.stat-card .stat-label{font-size:11px;color:var(--txt2);margin-top:2px}
.import-dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--txt2);font-size:13px}
.import-dropzone:active,.import-dropzone:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
.wv-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.wv-card:hover{border-color:var(--accent)}.wv-card:active{border-color:var(--accent)}
.wv-card-name{font-size:14px;font-weight:600;flex:1}.wv-card-desc{font-size:12px;color:var(--txt2)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.3)}.sidebar.open{transform:translateX(0)}.sidebar-close{display:flex}.sidebar-overlay.show{display:block}.hamburger{display:flex}.msg-row{max-width:90%}.bot-item-edit{opacity:1}.chat-header{padding:8px 12px;min-height:52px}.msgs{padding:12px}.chat-input-area{padding:8px 10px;padding-bottom:calc(8px + var(--safe-bottom))}.editor{padding:12px}.tab-btn{font-size:12px}}
</style>

function errMsg(e,f){if(!e)return f||'未知错误';if(typeof e==='string'&&e.length>0&&e!=='{}')return e;if(e.message&&typeof e.message==='string'&&e.message.length>1&&e.message!=='{}')return e.message.replace(/^AuthApiError:\s*/,'');if(e.status)return'服务器错误 (HTTP '+e.status+')';if(e.code)return'错误码: '+e.code;try{const s=JSON.stringify(e);if(s&&s!=='{}')return s}catch(_){}return f||'请求失败'}
async function getUserId(){const{data:{user}}=await supabase.auth.getUser();return user?.id}
function compressImage(file,maxW,maxH){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.7))};img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function Avatar({url,emoji,size,style}){const s={width:size||32,height:size||32,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'50%',flexShrink:0,...style};if(url)return<div style={s}><img src={url} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/></div>;return<div style={{...s,background:'var(--bg)'}}>{emoji||'🤖'}</div>}

// ===== Auth =====
function AuthPage(){
  const[mode,setMode]=useState('login');const[email,setEmail]=useState('');const[password,setPassword]=useState('');const[loading,setLoading]=useState(false);const[err,setErr]=useState('');
  const handleSubmit=async e=>{e.preventDefault();if(!email.trim()||!password){setErr('请填写邮箱和密码');return;}setLoading(true);setErr('');try{if(mode==='login'){const{error}=await supabase.auth.signInWithPassword({email,password});if(error){setErr(errMsg(error,'登录失败'));setLoading(false);return}}else{if(password.length<6){setErr('密码至少6位');setLoading(false);return}const{data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error){setErr(errMsg(error,'注册失败'));setLoading(false);return}setErr(data?.session?'✅ 注册成功！自动登录中...':'✅ 注册成功！请切换到登录页登录');if(!data?.session)setMode('login');setPassword('')}}catch(e){setErr(errMsg(e,'网络错误'))}setLoading(false)};
  return(<div className="auth-page"><div className="auth-card"><div className="auth-title">AI角色扮演</div><div className="auth-sub">创造属于你的故事</div>{err&&<div className="auth-error">{err}</div>}<form onSubmit={handleSubmit}><div className="auth-field"><label>邮箱</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" autoFocus/></div><div className="auth-field"><label>密码</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={mode==='login'?'输入密码':'设置密码（至少6位）'}/></div><button className="auth-btn" type="submit" disabled={loading}>{loading?'处理中...':mode==='login'?'登录':'注册'}</button></form><div className="auth-toggle">{mode==='login'?<>没有账号？<a onClick={()=>{setMode('register');setErr('')}}>注册</a></>:<>已有账号？<a onClick={()=>{setMode('login');setErr('')}}>登录</a></>}</div></div></div>)
}
function App(){const[session,setSession]=useState(null);const[loading,setLoading]=useState(true);useEffect(()=>{supabase.auth.getSession().then(({data:{session}})=>{setSession(session);setLoading(false)});const{data:{subscription}}=supabase.auth.onAuthStateChange((_e,session)=>setSession(session));return()=>subscription.unsubscribe()},[]);if(loading)return<div className="auth-page"><div style={{color:'var(--txt2)'}}>加载中...</div></div>;if(!session)return<AuthPage/>;return<MainApp/>}
function AvatarUpload({value,onChange,currentEmoji}){

// ===== Chat =====
function ChatWindow({bot,onUpdate,onMenuClick,userProfile,worldviews}){
  const[msgs,setMsgs]=useState([]);const[input,setInput]=useState('');const[loading,setLoading]=useState(false);const[err,setErr]=useState('');const endRef=useRef(null);const inputRef=useRef(null);
  const loadMessages=async()=>{try{const{data}=await supabase.from('messages').select('*').eq('bot_id',bot.id).order('created_at',{ascending:true});setMsgs(data||[])}catch(e){console.error(e);setMsgs([])}};
  useEffect(()=>{loadMessages();setErr('');setInput('');setTimeout(()=>inputRef.current?.focus(),100)},[bot.id]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs,loading]);
  const handleSend=async()=>{
    const content=input.trim();if(!content||loading)return;
    setInput('');setLoading(true);setErr('');
    const optimistic={id:'temp_'+Date.now(),bot_id:bot.id,role:'user',content,created_at:new Date().toISOString()};
    setMsgs(p=>[...p,optimistic]);
    try{
      const uid=await getUserId();
      const{data:s,error:sErr}=await supabase.from('user_settings').select('*').single();
      if(sErr||!s?.api_key){setErr('请先在设置中配置 API Key');setMsgs(p=>p.filter(m=>m.id!==optimistic.id));setLoading(false);return}
      const wv=bot.worldview_id?worldviews.find(w=>w.id===bot.worldview_id):null;
      const sysPrompt=buildSystemPrompt(bot,wv,s);
      const{error:insErr}=await supabase.from('messages').insert({user_id:uid,bot_id:bot.id,role:'user',content});
      if(insErr){setErr('保存失败');setMsgs(p=>p.filter(m=>m.id!==optimistic.id));setLoading(false);return}
      const history=(await supabase.from('messages').select('role,content').eq('bot_id',bot.id).order('created_at',{ascending:true}).limit(20)).data||[];
      const messages=[{role:'system',content:sysPrompt},...history.map(m=>({role:m.role,content:m.content}))];
      const res=await fetch(`${s.api_base_url||'https://api.deepseek.com'}/v1/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.api_key}`},body:JSON.stringify({model:bot.model||'deepseek-chat',messages,temperature:.8,max_tokens:2000})});
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`)}
      const d=await res.json();const reply=d.choices?.[0]?.message?.content||'...';
      await supabase.from('messages').insert({user_id:uid,bot_id:bot.id,role:'assistant',content:reply});
      await supabase.from('bots').update({updated_at:new Date().toISOString()}).eq('id',bot.id);
      await loadMessages();onUpdate();
    }catch(e){setErr('发送失败：'+errMsg(e));setMsgs(p=>p.filter(m=>m.id!==optimistic.id))}
    finally{setLoading(false);inputRef.current?.focus()}
  };
  const handleClear=async()=>{if(!window.confirm('确定清空聊天记录？'))return;try{await supabase.from('messages').delete().eq('bot_id',bot.id);setMsgs([])}catch(e){setErr('清空失败：'+errMsg(e))}};
  return(<div className="chat"><div className="chat-header" style={{borderBottomColor:bot.theme_color}}><button className="hamburger" onClick={onMenuClick}>☰</button><div className="chat-header-info"><div className="chat-header-avatar">{bot.avatar_url?<img src={bot.avatar_url} alt=""/>:bot.avatar}</div><div className="chat-header-text"><div className="chat-header-name">{bot.name}</div></div></div><button className="btn btn-ghost btn-sm" onClick={handleClear}>🗑</button></div><div className="msgs">{msgs.length===0&&<div className="msgs-empty"><div style={{fontSize:40}}>{bot.avatar_url?<img src={bot.avatar_url} style={{width:40,height:40,borderRadius:8,objectFit:'cover'}} alt=""/>:bot.avatar}</div><h3>开始和{bot.name}聊天吧！</h3></div>}{msgs.map(m=><MessageBubble key={m.id} msg={m} botAvatar={bot.avatar_url||bot.avatar} userAvatar={userProfile?.avatar_url} color={bot.theme_color}/>)}{loading&&<Typing avatar={bot.avatar_url||bot.avatar} name={bot.name} color={bot.theme_color}/>}{err&&<div className="error">{err}</div>}<div ref={endRef}/></div><div className="chat-input-area"><textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}}} placeholder={`跟${bot.name}说点什么...`} rows={1} disabled={loading} autoFocus/><button className="btn btn-primary send-btn" onClick={handleSend} disabled={!input.trim()||loading}>➤</button></div></div>)
}
function MessageBubble({msg,botAvatar,userAvatar,color}){const u=msg.role==='user';return(<div className={`msg-row${u?' user':''}`}>{!u?<div className="msg-avatar" style={{background:color+'20'}}>{typeof botAvatar==='string'&&botAvatar.startsWith('data:')?<img src={botAvatar} alt=""/>:botAvatar}</div>:<div className="msg-avatar user-avatar">{userAvatar?<img src={userAvatar} alt=""/>:'👤'}</div>}<div className={`msg-bubble${u?' user-bubble':' assistant-bubble'}`} style={!u?{borderLeft:'3px solid '+color}:{}}>{msg.content}</div>{!u&&<div style={{width:32,flexShrink:0}}/>}</div>)}
function Typing({avatar,name,color}){return<div className="typing"><div className="msg-avatar" style={{background:color+'20'}}>{typeof avatar==='string'&&avatar.startsWith('data:')?<img src={avatar} alt=""/>:avatar}</div><div className="typing-dots"><span/><span/><span/></div><span>{name} 正在输入...</span></div>}

    {tab==='api'&&(<form onSubmit={saveApi}><div className="form-group"><label>API Key</label><input type="password" value={s.api_key||''} onChange={e=>setS({...s,api_key:e.target.value})} placeholder="输入 DeepSeek API Key..."/><div className="form-hint"><a href="https://platform.deepseek.com/api_keys" target="_blank">获取 Key</a></div></div><div className="form-group"><label>API Base URL</label><input type="text" value={s.api_base_url||''} onChange={e=>setS({...s,api_base_url:e.target.value})} placeholder="https://api.deepseek.com"/></div><div className="form-group"><label>默认模型</label><input type="text" value={s.default_model||''} onChange={e=>setS({...s,default_model:e.target.value})} placeholder="deepseek-chat"/></div><button type="submit" className="btn btn-primary" style={{marginTop:'16px'}}>💾 保存</button></form>)}
    {tab==='account'&&(<form onSubmit={saveProfile}><div className="form-group"><label>用户名称</label><input type="text" value={profile.display_name} onChange={e=>setProfile({...profile,display_name:e.target.value})} placeholder="角色会这样称呼你" maxLength={20}/><div className="form-hint">对话时的称呼</div></div><div className="form-group"><label>头像</label><div style={{display:'flex',alignItems:'center',gap:12}}><AvatarUpload value={profile.avatar_url} onChange={v=>setProfile({...profile,avatar_url:v})} currentEmoji="👤"/></div></div><div className="form-group"><label>性别</label><select value={profile.gender} onChange={e=>setProfile({...profile,gender:e.target.value})}><option value="">不设置</option><option value="male">男</option><option value="female">女</option><option value="other">其他</option></select></div><button type="submit" className="btn btn-primary" style={{marginTop:'16px'}}>💾 保存</button></form>)}
    {tab==='sync'&&(<div><div className="sync-section"><h3>📤 导出备份</h3><p>下载所有角色、消息和设置</p><button className="btn btn-primary" onClick={handleExport}>📥 下载备份</button>{exportMsg&&<div className="error" style={{background:exportMsg.includes('✅')?'#f0fdf4':'#fef2f2',color:exportMsg.includes('✅')?'#16a34a':'#dc2626',marginTop:8,marginBottom:0}}>{exportMsg}</div>}</div><div className="sync-section"><h3>📥 导入恢复</h3><label className="import-dropzone" style={{display:'block'}}><input type="file" accept=".json" onChange={handleFileImport} style={{display:'none'}}/>📁 选择备份文件</label>{importMsg&&<div className="error" style={{background:importMsg.includes('✅')?'#f0fdf4':'#fef2f2',color:importMsg.includes('✅')?'#16a34a':'#dc2626',marginTop:8,marginBottom:0}}>{importMsg}</div>}</div></div>)}
  </div>)
}

// ===== MainApp =====
function MainApp(){
  const[bots,setBots]=useState([]);const[worldviews,setWorldviews]=useState([]);const[activeId,setActiveId]=useState(null);const[view,setView]=useState('chat');const[editBot,setEditBot]=useState(null);const[editWv,setEditWv]=useState(null);const[sidebarOpen,setSidebarOpen]=useState(!isMobile());const[email,setEmail]=useState('');const[userProfile,setUserProfile]=useState(null);const[listOpen,setListOpen]=useState(false);

  useEffect(()=>{(async()=>{try{const{data}=await supabase.auth.getUser();setEmail(data.user?.email||'');await ensureSettings();await loadUserProfile();await loadAll()}catch(e){console.error('init:',e)}const h=()=>{setSidebarOpen(!isMobile())};window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h)})()},[]);

  const ensureSettings=async()=>{try{const uid=await getUserId();if(!uid)return;const{data,error}=await supabase.from('user_settings').select('user_id').eq('user_id',uid).maybeSingle();if(error&&error.code==='PGRST116'){await supabase.from('user_settings').insert({user_id:uid,api_base_url:'https://api.deepseek.com',default_model:'deepseek-chat'})}}catch(e){console.error(e)}};
  const loadUserProfile=async()=>{try{const uid=await getUserId();if(!uid)return;const{data}=await supabase.from('user_settings').select('display_name,avatar_url,gender').eq('user_id',uid).maybeSingle();if(data)setUserProfile(data)}catch(e){console.error(e)}};
  const loadAll=async()=>{try{const{data:b}=await supabase.from('bots').select('*').order('updated_at',{ascending:false});const{data:w}=await supabase.from('worldviews').select('*').order('updated_at',{ascending:false});setBots(b||[]);setWorldviews(w||[])}catch(e){console.error(e)}};

  const handleHome=()=>{setActiveId(null);setView('chat')};
  const handleLogout=async()=>{try{await supabase.auth.signOut()}catch(e){console.error(e)}};
  const handleProfileClick=()=>{setView('settings_account')};
  const refresh=async()=>{await loadAll();await loadUserProfile()};
  const activeBot=bots.find(b=>b.id===activeId)||null;

  return(<div className="app"><Sidebar bots={bots} activeId={activeId} onSelect={id=>{setActiveId(id);setView('chat')}} onHome={handleHome} onCreate={()=>{setEditBot(null);setView('create')}} onEdit={b=>{setEditBot(b);setView('edit')}} onSettings={()=>setView('settings')} onProfileClick={handleProfileClick} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onLogout={handleLogout} email={email} userProfile={userProfile} onCreateWorldview={()=>{setEditWv(null);setView('create_wv')}} onListWorldviews={()=>{setView('list_wv')}} listOpen={listOpen} setListOpen={setListOpen}/>
  <main className="main">
    {view==='create'&&<BotEditor onDone={()=>{loadAll();setView('chat')}} onCancel={()=>{setView('chat')}} worldviews={worldviews}/>}
    {view==='edit'&&editBot&&<BotEditor bot={editBot} onDone={()=>{loadAll();setView('chat');setEditBot(null)}} onCancel={()=>{setView('chat')}} worldviews={worldviews}/>}
    {view==='create_wv'&&<WorldviewEditor onDone={()=>{loadAll();setView('chat');setEditWv(null)}} onCancel={()=>{setView('chat')}}/>}
    {view==='edit_wv'&&editWv&&<WorldviewEditor wv={editWv} onDone={()=>{loadAll();setView('list_wv');setEditWv(null)}} onCancel={()=>{setView('list_wv')}}/>}
    {view==='list_wv'&&<WorldviewList onBack={()=>setView('chat')} worldviews={worldviews} onEdit={w=>{setEditWv(w);setView('edit_wv')}} onRefresh={loadAll}/>}
    {view==='settings'&&<SettingsView onBack={()=>setView('chat')} onRefresh={refresh} userProfile={userProfile}/>}
    {view==='settings_account'&&<SettingsView onBack={()=>setView('chat')} onRefresh={refresh} userProfile={userProfile} initialTab="account"/>}
    {view==='chat'&&activeBot&&<ChatWindow bot={activeBot} onUpdate={loadAll} onMenuClick={()=>setSidebarOpen(v=>!v)} userProfile={userProfile} worldviews={worldviews}/>}
    {view==='chat'&&!activeBot&&<EmptyState onMenuClick={()=>setSidebarOpen(v=>!v)}/>}
  </main></div>)
}
function EmptyState({onMenuClick}){return<div className="empty">{isMobile()&&<button className="hamburger" style={{display:'flex',marginBottom:12}} onClick={onMenuClick}>☰</button>}<div className="empty-icon">👋</div><h2>欢迎回来！</h2><p>创造属于你的故事。</p></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
